name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - shell: pwsh
        run: |
          $files = @(
            Get-ChildItem "test/unit/*.test.js", "test/integration/*.test.js" |
              ForEach-Object { $_.FullName }
          )
          Write-Host "node: $(node --version)"
          Write-Host "test files: $($files.Count)"
          node --test --test-isolation=none @files
